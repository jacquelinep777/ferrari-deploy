name: terraform

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to plan
        type: choice
        default: dev
        options:
          - dev
          - test
          - acc
          - prod

permissions:
  contents: read
  id-token: write

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      - name: Configure private module access
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.TERRAFORM_JUMPHOST_SSH_KEY }}" > ~/.ssh/jumphost
          printf '%s\n' "${{ secrets.TERRAFORM_NETWORK_SSH_KEY }}" > ~/.ssh/network
          printf '%s\n' "${{ secrets.TERRAFORM_VMS_SSH_KEY }}" > ~/.ssh/vms
          printf '%s\n' "${{ secrets.TERRAFORM_BASTION_ACCESS_SSH_KEY }}" > ~/.ssh/bastion_access
          chmod 600 ~/.ssh/jumphost ~/.ssh/network ~/.ssh/vms ~/.ssh/bastion_access
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          printf '%s\n' \
            'Host github.com-jacquelinep777-jumphost' \
            '  HostName github.com' \
            '  User git' \
            '  IdentityFile ~/.ssh/jumphost' \
            '  IdentitiesOnly yes' \
            'Host github.com-jacquelinep777-network' \
            '  HostName github.com' \
            '  User git' \
            '  IdentityFile ~/.ssh/network' \
            '  IdentitiesOnly yes' \
            'Host github.com-jacquelinep777-vms' \
            '  HostName github.com' \
            '  User git' \
            '  IdentityFile ~/.ssh/vms' \
            '  IdentitiesOnly yes' \
            'Host github.com-jacquelinep777-bastion-access' \
            '  HostName github.com' \
            '  User git' \
            '  IdentityFile ~/.ssh/bastion_access' \
            '  IdentitiesOnly yes' \
            >> ~/.ssh/config
          git config --global url."ssh://git@github.com-jacquelinep777-jumphost/jacquelinep777/xx-azurerm-stack-jumphost.git".insteadOf "ssh://git@github.com-jacquelinep777/jacquelinep777/xx-azurerm-stack-jumphost.git"
          git config --global url."ssh://git@github.com-jacquelinep777-network/jacquelinep777/xx-azurerm-network.git".insteadOf "ssh://git@github.com-jacquelinep777/jacquelinep777/xx-azurerm-network.git"
          git config --global url."ssh://git@github.com-jacquelinep777-vms/jacquelinep777/xx-azurerm-vms.git".insteadOf "ssh://git@github.com-jacquelinep777/jacquelinep777/xx-azurerm-vms.git"
          git config --global url."ssh://git@github.com-jacquelinep777-bastion-access/jacquelinep777/xx-azurerm-stack-bastion-access.git".insteadOf "ssh://git@github.com-jacquelinep777/jacquelinep777/xx-azurerm-stack-bastion-access.git"

      - name: Install conftest
        run: |
          curl -L https://github.com/open-policy-agent/conftest/releases/download/v0.59.0/conftest_0.59.0_Linux_x86_64.tar.gz | tar xz
          sudo mv conftest /usr/local/bin/conftest

      - name: Check
        run: make check

  plan:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    env:
      TF_ENVIRONMENT: ${{ github.event.inputs.environment }}

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Configure private module access
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.TERRAFORM_JUMPHOST_SSH_KEY }}" > ~/.ssh/jumphost
          printf '%s\n' "${{ secrets.TERRAFORM_NETWORK_SSH_KEY }}" > ~/.ssh/network
          printf '%s\n' "${{ secrets.TERRAFORM_VMS_SSH_KEY }}" > ~/.ssh/vms
          printf '%s\n' "${{ secrets.TERRAFORM_BASTION_ACCESS_SSH_KEY }}" > ~/.ssh/bastion_access
          chmod 600 ~/.ssh/jumphost ~/.ssh/network ~/.ssh/vms ~/.ssh/bastion_access
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          printf '%s\n' \
            'Host github.com-jacquelinep777-jumphost' \
            '  HostName github.com' \
            '  User git' \
            '  IdentityFile ~/.ssh/jumphost' \
            '  IdentitiesOnly yes' \
            'Host github.com-jacquelinep777-network' \
            '  HostName github.com' \
            '  User git' \
            '  IdentityFile ~/.ssh/network' \
            '  IdentitiesOnly yes' \
            'Host github.com-jacquelinep777-vms' \
            '  HostName github.com' \
            '  User git' \
            '  IdentityFile ~/.ssh/vms' \
            '  IdentitiesOnly yes' \
            'Host github.com-jacquelinep777-bastion-access' \
            '  HostName github.com' \
            '  User git' \
            '  IdentityFile ~/.ssh/bastion_access' \
            '  IdentitiesOnly yes' \
            >> ~/.ssh/config
          git config --global url."ssh://git@github.com-jacquelinep777-jumphost/jacquelinep777/xx-azurerm-stack-jumphost.git".insteadOf "ssh://git@github.com-jacquelinep777/jacquelinep777/xx-azurerm-stack-jumphost.git"
          git config --global url."ssh://git@github.com-jacquelinep777-network/jacquelinep777/xx-azurerm-network.git".insteadOf "ssh://git@github.com-jacquelinep777/jacquelinep777/xx-azurerm-network.git"
          git config --global url."ssh://git@github.com-jacquelinep777-vms/jacquelinep777/xx-azurerm-vms.git".insteadOf "ssh://git@github.com-jacquelinep777/jacquelinep777/xx-azurerm-vms.git"
          git config --global url."ssh://git@github.com-jacquelinep777-bastion-access/jacquelinep777/xx-azurerm-stack-bastion-access.git".insteadOf "ssh://git@github.com-jacquelinep777/jacquelinep777/xx-azurerm-stack-bastion-access.git"

      - name: Install conftest
        run: |
          curl -L https://github.com/open-policy-agent/conftest/releases/download/v0.59.0/conftest_0.59.0_Linux_x86_64.tar.gz | tar xz
          sudo mv conftest /usr/local/bin/conftest

      - name: Plan
        run: make plan ENV=${TF_ENVIRONMENT}

      - name: Blast radius policy
        run: make policy

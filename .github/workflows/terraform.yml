name: terraform

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to plan
        type: choice
        default: dev
        options:
          - dev
          - test
          - acc
          - prod

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    env:
      TF_ENVIRONMENT: ${{ github.event.inputs.environment || 'dev' }}

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      - name: Install conftest
        run: |
          curl -L https://github.com/open-policy-agent/conftest/releases/download/v0.59.0/conftest_0.59.0_Linux_x86_64.tar.gz | tar xz
          sudo mv conftest /usr/local/bin/conftest

      - name: Format
        run: terraform fmt -check -recursive

      - name: Init
        working-directory: jumphost
        run: terraform init -input=false -backend-config=../environments/${TF_ENVIRONMENT}.tfbackend

      - name: Validate
        working-directory: jumphost
        run: terraform validate

      - name: Plan
        working-directory: jumphost
        run: |
          terraform plan -input=false -var-file=../environments/${TF_ENVIRONMENT}.tfvars -out=tfplan
          terraform show -json tfplan > tfplan.json

      - name: Blast radius policy
        working-directory: jumphost
        run: conftest test tfplan.json --policy ../policies
